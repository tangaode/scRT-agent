[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrta-agent"
version = "0.1.0"
description = "A focused multi-agent workflow for paired scRNA-seq and scTCR-seq analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "scRTA" }]
dependencies = []

[project.optional-dependencies]
analysis = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
llm = [
  "openai>=1.0",
]
dev = [
  "pytest>=8",
]

[project.scripts]
scrta-agent = "scrta_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrta_agent = ["prompts/*.md", "templates/*.py.tmpl"]
